<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cinco y Media — IA y automatización para empresas en Valencia.">
    <title>Cinco y Media — IA y automatización para empresas en Valencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=Inter:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

    <header class="header">
      <a class="header__brand" href="/" aria-label="Cinco y Media — Inicio">
        <img class="header__logo" src="../Logos/Logos cincoymedia-01.svg" alt="Cinco y Media" width="170" height="91">
      </a>
      <a class="header__menu" href="#menu">Menu</a>
    </header>

    <main>
      <!-- COMPOSICIÓN TIPOGRÁFICA — Estructura visual aria-hidden, H1 semántico oculto -->
      <section class="hero" aria-labelledby="hero-h1">

        <h1 id="hero-h1" class="sr-only">IA y automatización para empresas en Valencia.</h1>

        <div class="poster">
          <div class="poster__row poster__row--top">
            <span class="poster__word" aria-hidden="true">AUTOMATIZACIÓN</span>
          </div>
          <div class="poster__row poster__row--bottom">
            <span class="poster__word poster__word--ia" aria-hidden="true">IA</span>
            <div class="poster__img-wrap" aria-hidden="true">
              <img class="poster__img" src="hero-visual.jpg" alt="" width="1200" height="380">
            </div>
          </div>
        </div>

        <hr class="rule" aria-hidden="true">

        <div class="editorial">
          <p class="editorial__text">
            Aplicamos inteligencia artificial y automatización<br>
            para reducir tareas manuales, mejorar procesos<br>
            y hacer que tu negocio funcione mejor.
          </p>
          <a class="editorial__link" href="#contacto">
            Cuéntanos qué quieres mejorar&nbsp;&nbsp;↗
          </a>
        </div>

      </section>
    </main>

  </body>
</html>
